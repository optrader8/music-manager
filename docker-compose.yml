version: "3.9"

services:
  music-manager-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "32000:8000"
    volumes:
      - ./backend:/app
      - /mnt/nas-music:/mnt/nas-music:ro
    environment:
      - DATABASE_URL=sqlite:///./music_manager.db
      - MUSIC_LIBRARY_PATH=/music
      - FILE_BROWSER_ROOT_PATH=/mnt/nas-music
      - FILE_BROWSER_MAX_FILE_SIZE=100MB
      - FILE_BROWSER_CACHE_TTL=300
      - PYTHONPATH=/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - music-manager-network

  music-manager-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "32001:32001"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - music-manager-backend
    networks:
      - music-manager-network

  music-manager-redis:
    image: redis:7-alpine
    ports:
      - "32002:6379"
    command: redis-server --save 20 1 --loglevel warning
    networks:
      - music-manager-network

networks:
  music-manager-network:
    driver: bridge
